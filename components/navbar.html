<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge Navbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white">

  <!-- Badge container (do not place nav inside here) -->
  <div id="badge-container" data-source="components/empty.html"></div>

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-gray-900/95 backdrop-blur-sm border-b border-gray-800 z-50">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between h-20">
        <!-- Logo -->
        <a href="#" class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gradient-to-r from-cyan-400 to-purple-500 rounded-lg flex items-center justify-center">
            <i data-lucide="zap" class="w-6 h-6 text-white"></i>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">SkillBridge</span>
        </a>

        <!-- Desktop nav -->
        <div class="hidden md:flex items-center space-x-8">
          <a href="#" class="hover:text-cyan-400">Find Freelancers</a>
          <a href="#" class="hover:text-cyan-400">Categories</a>
          <a href="#" class="hover:text-cyan-400">Browse Jobs</a>
          <a href="#" class="hover:text-cyan-400">About</a>
          <a href="#" class="hover:text-cyan-400">Contact</a>
        </div>

        <!-- Mobile menu button -->
        <button class="md:hidden text-gray-300 hover:text-white transition-colors" data-id="mobile-menu-toggle">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Mobile menu (hidden on load, shows when toggled) -->
      <div class="hidden py-4 border-t border-gray-800 md:hidden" data-id="mobile-nav">
        <div class="flex flex-col space-y-4">
          <a href="#" class="hover:text-cyan-400">Find Freelancers</a>
          <a href="#" class="hover:text-cyan-400">Categories</a>
          <a href="#" class="hover:text-cyan-400">Browse Jobs</a>
          <a href="#" class="hover:text-cyan-400">About</a>
          <a href="#" class="hover:text-cyan-400">Contact</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { loadComponents } from "./loader.js";
    document.addEventListener("DOMContentLoaded", async () => {
      // Safe: loader.js only fills #badge-container, not the navbar itself!
      await loadComponents(["#badge-container"]);
      const menuButton = document.querySelector('[data-id="mobile-menu-toggle"]');
      const mobileNav = document.querySelector('[data-id="mobile-nav"]');
      if (!menuButton || !mobileNav) {
        console.error("Navbar toggle elements not found");
        return;
      }
      menuButton.addEventListener("click", () => {
        mobileNav.classList.toggle("hidden");
        // Icon toggle logic
        const icon = menuButton.querySelector("i");
        icon.setAttribute(
          "data-lucide",
          mobileNav.classList.contains("hidden") ? "menu" : "x"
        );
        lucide.createIcons();
      });
    });
  </script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
