<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge Navbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 w-full bg-gray-900/95 backdrop-blur-sm border-b border-gray-800 z-50">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo -->
        <a href="#" class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gradient-to-r from-cyan-400 to-purple-500 rounded-lg flex items-center justify-center">
            <i data-lucide="zap" class="w-6 h-6 text-white"></i>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">SkillBridge</span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="hover:text-cyan-400">Home</a>
          <a href="freelancers.html" class="hover:text-cyan-400">Find Freelancers</a>
          <a href="categories.html" class="hover:text-cyan-400">Categories</a>
          <a href="jobs.html" class="hover:text-cyan-400">Browse Jobs</a>
          <a href="about.html" class="hover:text-cyan-400">About</a>
          <a href="contact.html" class="hover:text-cyan-400">Contact</a>
          <a href="profile.html" class="hover:text-cyan-400">My Profile</a>
          <a href="dashboard.html" class="hover:text-cyan-400">Dashboard</a>
          <a href="login.html" class="hover:text-cyan-400">Login</a>
        </div>

        <!-- Mobile menu button -->
        <button id="mobile-menu-toggle" class="md:hidden text-gray-300 hover:text-white transition-colors">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Mobile Nav -->
      <div id="mobile-nav" class="hidden flex-col py-4 border-t border-gray-800 space-y-4 md:hidden">
        <a href="freelancers.html" class="hover:text-cyan-400">Find Freelancers</a>
        <a href="categories.html" class="hover:text-cyan-400">Categories</a>
        <a href="jobs.html" class="hover:text-cyan-400">Browse Jobs</a>
        <a href="about.html" class="hover:text-cyan-400">About</a>
        <a href="contact.html" class="hover:text-cyan-400">Contact</a>
        <a href="profile.html" class="hover:text-cyan-400">My Profile</a>
        <a href="dashboard.html" class="hover:text-cyan-400">Dashboard</a>
        <a href="login.html" class="hover:text-cyan-400">Login</a>
      </div>
    </div>
  </nav>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const toggleBtn = document.getElementById("mobile-menu-toggle");
      const mobileNav = document.getElementById("mobile-nav");
      const icon = toggleBtn.querySelector("i");

      toggleBtn.addEventListener("click", () => {
        const isHidden = mobileNav.classList.toggle("hidden");
        icon.setAttribute("data-lucide", isHidden ? "menu" : "x");
        lucide.createIcons();
      });
    });
  </script>
</body>
</html>
